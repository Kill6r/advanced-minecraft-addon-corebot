prefix: "&7[&6&l✭&7]"

Command:
  reload: "<prefix> &fThe plugin has been reloaded."
  Help: |-
    &7
    &f&l        AdvancedMinecraft
    &7
    &e/sync <code> &7- &fLink your Minecraft account
    &e/gcode help &7- &fShow this help
    &7
  error:
    permission: "<prefix> &fYou do not have permission to run that command."
    syntax: "<prefix> &fInvalid argument. Use &e/gcode help&f."

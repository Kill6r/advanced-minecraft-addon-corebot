    usage: "&7[&4!&7] &fUse: &e/sync <code>"
    player_only: "&7[&4!&7] &cOnly a player can use /sync."
    invalid: "&7[&4!&7] &cThe code &7(&b<code>&7) &cis not valid."
    code_already_used: "&7[&4!&7] &cThat synchronization code has already been used."
    database_error: "&7[&4!&7] &cThe synchronization service is temporarily unavailable. Please try again later."
    minecraft_already_synced: "&7[&4!&7] &cYour Minecraft account is already linked with &4<discord_tag>&c."
    success: "<prefix> &bThank you, &4&l<player_name>&b. Your account was successfully linked with &4<discord_tag>&b!"

Admin:
  Help: |-
    &7
    &f&l        AdvancedMinecraft v1.0.1
    &7
